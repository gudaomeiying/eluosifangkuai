workflows:
  # ========== iOS 未签名 IPA（Simulator，无需证书）==========
  ios-unsigned:
    name: iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20.17.0
      xcode: latest
      cocoapods: default

    scripts:
      # 1. 安装依赖
      - name: Install dependencies
        script: npm install

      # 2. 用 expo prebuild 生成 iOS 原生工程
      - name: Expo prebuild (iOS)
        script: npx expo prebuild --platform ios --clean

      # 3. 安装 CocoaPods 依赖
      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      # 4. 安装 xcpretty（格式化构建输出）
      - name: Install xcpretty
        script: gem install xcpretty --no-document 2>/dev/null || true

      # 5. 构建 Simulator IPA（完全不需要签名证书）
      #    注意：必须用 -sdk iphonesimulator，iphoneos sdk 强制要求签名无法绕过
      - name: Build Simulator IPA (no signing required)
        script: |
          cd ios
          xcodebuild \
            -workspace Tetris.xcworkspace \
            -scheme Tetris \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ./build \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true

      # 6. 将 .app 打包成 .ipa
      - name: Package IPA
        script: |
          APP_PATH=$(find ios/build -name "Tetris.app" -path "*Release-iphonesimulator*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" | head -1)
          fi
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi
          mkdir -p ios/build/ipa/Payload
          cp -r "$APP_PATH" ios/build/ipa/Payload/
          cd ios/build/ipa
          zip -r ../Tetris-unsigned.ipa Payload
          echo "IPA created: ios/build/Tetris-unsigned.ipa"

    artifacts:
      - ios/build/Tetris-unsigned.ipa

    publishing:
      email:
        recipients:
          - 345422168@qq.com
        notify:
          success: true
          failure: true

  # ========== Android APK（无需签名证书）==========
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 20.17.0
      java: 17

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Expo prebuild (Android)
        script: npx expo prebuild --platform android --clean

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - 345422168@qq.com
        notify:
          success: true
          failure: true

  # ========== 同时构建 IPA + APK ==========
  both-platforms:
    name: iOS Simulator IPA + Android APK
    max_build_duration: 90
    instance_type: mac_mini_m2

    environment:
      node: 20.17.0
      xcode: latest
      cocoapods: default
      java: 17

    scripts:
      - name: Install dependencies
        script: npm install

      - name: Expo prebuild (all platforms)
        script: npx expo prebuild --clean

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Install xcpretty
        script: gem install xcpretty --no-document 2>/dev/null || true

      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build iOS Simulator IPA
        script: |
          cd ios
          xcodebuild \
            -workspace Tetris.xcworkspace \
            -scheme Tetris \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ./build \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true

      - name: Package IPA
        script: |
          APP_PATH=$(find ios/build -name "Tetris.app" -path "*Release-iphonesimulator*" | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/build -name "*.app" | head -1)
          fi
          echo "App path: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            exit 1
          fi
          mkdir -p ios/build/ipa/Payload
          cp -r "$APP_PATH" ios/build/ipa/Payload/
          cd ios/build/ipa
          zip -r ../Tetris-unsigned.ipa Payload
          echo "IPA created: ios/build/Tetris-unsigned.ipa"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - ios/build/Tetris-unsigned.ipa

    publishing:
      email:
        recipients:
          - 345422168@qq.com
        notify:
          success: true
          failure: true
